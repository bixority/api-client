[package]
authors = ["Olegs Korsaks <olegs.korsaks@bixority.com>"]
categories = ["api-client"]
description = "API client"
rust-version = "1.98"
edition = "2024"
keywords = ["api", "client"]
license = "GPL-3.0-only"
name = "api-client"
readme = "README.md"
repository = "https://github.com/bixority/api-client"
version = "0.0.11"

[lib]
name = "api_client"


[dependencies]
bytes = "1.12"
chrono = "0.4"
futures = "0.3"
http = "1.5"
object-storage-client = { version = "0.1", registry = "bixority-codeberg" }
reqwest = { version = "0.13", features = ["json", "cookies", "rustls", "stream"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tower = "0.5"
tracing = "0.1"
url = "2.5"
uuid = { version = "1.25", features = ["v4"] }

[dev-dependencies]
mockall = "0.15"
predicates = { version = "3.1", features = ["regex"] }

[lints.rust]
linker_messages = "allow"
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
needless_for_each = { level = "allow", priority = 1 }

[profile.dev]
debug = true
incremental = true
opt-level = 0

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.release.package."*"]
codegen-units = 1
debug = false
opt-level = 3
strip = true
