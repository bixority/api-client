[package]
authors = ["Olegs Korsaks <olegs.korsaks@bixority.com>"]
categories = ["web-programming::http-client"]
description = "API client"
rust-version = "1.100"
edition = "2024"
keywords = ["api", "client"]
license = "GPL-3.0-only"
name = "api-client"
readme = "README.md"
repository = "https://github.com/bixority/api-client"
version = "0.2.2"

[lib]
name = "api_client"


[dependencies]
bytes = "1.12"
chrono = { version = "0.4", optional = true }
futures = "0.3"
http = "1.5"
object-storage-client = { version = "0.4.15", registry = "bixority-codeberg", default-features = false, features = ["s3"], optional = true }
reqwest = { version = "0.13", features = ["json", "cookies", "rustls", "stream", "http2"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["sync", "time", "rt"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1.29", features = ["v4"], optional = true }

[dev-dependencies]
# The Azurite integration test writes the audit log to `az://`, a backend that
# `audit` does not link.
object-storage-client = { version = "0.4.15", registry = "bixority-codeberg", default-features = false, features = ["azure"] }
mockall = "0.15"
predicates = { version = "3.1", features = ["regex"] }
rcgen = "0.14"
rustls = "0.23"
tempfile = "3"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tokio-rustls = "0.26"
testcontainers = { version = "0.28", default-features = false, features = ["aws-lc-rs"] }

[features]
default = ["gzip", "brotli", "zstd", "deflate"]
# Response decompression, forwarded to reqwest.
gzip = ["reqwest/gzip"]
brotli = ["reqwest/brotli"]
zstd = ["reqwest/zstd"]
deflate = ["reqwest/deflate"]
# The audit layer, the `Auditor` trait and the audit types, without any storage backend.
audit-core = ["dep:chrono", "dep:uuid"]
# `audit-core` plus `ObjectStorageAuditor`. It writes to S3 (`s3://`) only; the CLI,
# encryption and the GCS, Azure and HTTP backends of object-storage-client are not linked.
audit = ["audit-core", "dep:object-storage-client"]
# Also support AWS profiles that use SSO or `credential_process` for the audit store.
audit-aws-profile = ["audit", "object-storage-client/aws-profile"]

[[example]]
name = "audit"
required-features = ["audit"]

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["audit"]

[lints.rust]
linker_messages = "allow"
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
needless_for_each = { level = "allow", priority = 1 }

[profile.dev]
debug = true
incremental = true
opt-level = 0

# Applies only to builds of this repository, never to crates that depend on it.
[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
debug = "line-tables-only"
